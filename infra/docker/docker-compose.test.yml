version: "3.9"

# Isolated test environment — ephemeral, no persistence
services:
  postgres_test:
    image: postgres:16-alpine
    container_name: saar_postgres_test
    environment:
      POSTGRES_USER: saar_test
      POSTGRES_PASSWORD: saar_test
      POSTGRES_DB: saar_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saar_test -d saar_test"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis_test:
    image: redis:7-alpine
    container_name: saar_redis_test
    ports:
      - "6380:6379"
    command: redis-server
    tmpfs:
      - /data
