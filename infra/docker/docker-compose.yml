version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: saar_postgres_dev
    environment:
      POSTGRES_USER: saar_user
      POSTGRES_PASSWORD: saar_pass
      POSTGRES_DB: saar_dev
    ports:
      - "5432:5432"
    volumes:
      - saar_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saar_user -d saar_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: saar_redis_dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --requirepass ""
    volumes:
      - saar_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  saar_postgres_data:
  saar_redis_data:
