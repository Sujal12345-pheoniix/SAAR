services:
  - type: web
    name: saar-api
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @saar/contracts build && pnpm --filter @saar/domain build && pnpm --filter @saar/api build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY_HOPS
        value: "1"

  - type: worker
    name: saar-worker
    runtime: node
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pnpm install --frozen-lockfile && pnpm db:generate && pnpm --filter @saar/contracts build && pnpm --filter @saar/domain build && pnpm --filter @saar/worker build
    startCommand: node apps/worker/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOG_LEVEL
        value: info
